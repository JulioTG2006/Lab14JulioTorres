name: Build and Deploy .NET Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Lab14JulioTorres/Lab14JulioTorres.csproj

      - name: Build application
        run: dotnet build Lab14JulioTorres/Lab14JulioTorres.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish Lab14JulioTorres/Lab14JulioTorres.csproj --configuration Release --no-build --output ./published

      - name: Upload published files
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./published
